[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha101"
version = "0.1.0"
description = "Crypto factor mining toolkit with Alpha101-style factor expressions."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "YYDH", email = "867965859@qq.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100",
    "freqtrade",
    "numpy>=1.23",
    "pandas>=1.5",
    "polars>=1.0",
    "pydantic>=2",
    "pyarrow>=10",
    "pytest>=8",
    "requests>=2.28",
    "scipy>=1.9",
    "tqdm>=4.64",
    "uvicorn>=0.22",
]

[project.urls]
Homepage = "https://github.com/yydhYYDH/alpha101"

[project.scripts]
alpha101-expression = "alpha101.cli.expression:main"
alpha101-factor-search = "alpha101.cli.factor_search:main"
alpha101-research-server = "alpha101.cli.research_server:main"

[tool.setuptools.packages.find]
include = ["alpha101*"]

[tool.setuptools.package-data]
"alpha101.research" = ["templates/*.html"]
